<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My cats</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-snap-type: y mandatory;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .background-section {
            min-height: 100vh;
            min-height: 100svh;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 1rem;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            scroll-snap-align: start;
            scroll-snap-stop: always;
        }

        .background-section p {
            min-height: 4rem;
            margin: 0;
            padding: 1rem;
            border-radius: 0.5rem;
            background: rgb(0 0 0 / 35%);
            color: white;
        }

        .fluffy {
            background-image: url("fluffy.jpg");
        }

        .mabrotsoukalos {
            background-image: url("mabrotsoukalos.jpg");
        }

        .menios {
            background-image: url("menios.jpg");
        }

        .moboros {
            background-image: url("moboros.jpg");
        }

        .paoktsou {
            background-image: url("paoktsou.jpg");
        }

        .ritsa {
            background-image: url("ritsa.jpg");
        }

        .thodoras {
            background-image: url("thodoras.jpg");
        }
    </style>
</head>
<body>
    <main>
        <section class="background-section fluffy">
            <p></p>
            <p></p>
            <p></p>
        </section>
        <section class="background-section mabrotsoukalos">
            <p></p>
            <p></p>
            <p></p>
        </section>
        <section class="background-section menios">
            <p></p>
            <p></p>
            <p></p>
        </section>
        <section class="background-section moboros">
            <p></p>
            <p></p>
            <p></p>
        </section>
        <section class="background-section paoktsou">
            <p></p>
            <p></p>
            <p></p>
        </section>
        <section class="background-section ritsa">
            <p></p>
            <p></p>
            <p></p>
        </section>
        <section class="background-section thodoras">
            <p></p>
            <p></p>
            <p></p>
        </section>
    </main>
</body>
</html>
